<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Imperium · Rental Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@0,500;0,600;0,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08080a; --bg2:#0f0f13; --panel:#14141a;
  --line:#26262f; --line2:#33333f;
  --gold:#d4af37; --gold-br:#ecca6a; --gold-dp:#8a6d22; --gold-soft:rgba(212,175,55,.12);
  --txt:#ececf0; --mut:#8e8e9c; --mut2:#6a6a76;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1200px 600px at 80% -10%,rgba(212,175,55,.06),transparent 60%),radial-gradient(900px 500px at 0% 0%,rgba(212,175,55,.04),transparent 55%),var(--bg);min-height:100vh}
::-webkit-scrollbar{height:11px;width:11px}::-webkit-scrollbar-track{background:#0c0c10}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--gold-dp),#5c4a18);border-radius:6px;border:2px solid #0c0c10}
::-webkit-scrollbar-thumb:hover{background:var(--gold)}
a{color:var(--gold-br)}
.wrap{max-width:1640px;margin:0 auto;padding:16px 20px 60px}
.panel{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:15px;padding:18px}
.panel h2{font-family:var(--serif);font-weight:600;font-size:22px;margin:0 0 3px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.muted{color:var(--mut);font-size:12.5px}
.calbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.calbar input[type=date]{background:var(--bg2);color:var(--txt);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font-family:var(--mono);font-size:13px}
.calbar .seg{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.calbar .seg button{background:var(--bg2);color:var(--mut);border:0;padding:9px 13px;font-size:13px;cursor:pointer}
.calbar .seg button.active{background:var(--gold-soft);color:var(--gold-br)}
.btn{font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;background:var(--gold-soft);color:var(--gold-br);border:1px solid var(--gold-dp);padding:9px 15px;border-radius:8px}
.btn:hover{background:rgba(212,175,55,.2);border-color:var(--gold)}
.calscroll{overflow-x:auto;overflow-y:hidden;border:1px solid var(--line);border-radius:12px;background:#0b0b0e;position:relative;-webkit-overflow-scrolling:touch}
.calgrid{position:relative}
.LBLW{width:200px}
.calhead{position:sticky;top:0;z-index:6;background:#0d0d11;border-bottom:1px solid var(--line2)}
.monthrow,.dayrow{display:flex}
.cornercell{position:sticky;left:0;z-index:7;background:#0d0d11;border-right:1px solid var(--line2);display:flex;align-items:center;padding:0 12px;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut)}
.monthcell{flex:0 0 auto;font-family:var(--serif);font-size:14px;color:var(--gold-br);border-right:1px solid var(--line);padding:7px 0 5px 10px;white-space:nowrap;letter-spacing:.5px}
.daycell{flex:0 0 auto;text-align:center;font-family:var(--mono);font-size:10px;color:var(--mut2);padding:5px 0;border-right:1px solid #18181f}
.daycell .dow{display:block;font-size:8px;color:#4a4a55}
.daycell.we{background:rgba(255,255,255,.018)}
.daycell.today{color:var(--gold-br)}
.carrow{display:flex;position:relative;border-bottom:1px solid #16161c}
.carrow:hover{background:rgba(212,175,55,.035)}
.carlabel{position:sticky;left:0;z-index:5;background:#0c0c10;border-right:1px solid var(--line2);display:flex;align-items:center;gap:9px;padding:0 12px}
.carrow:hover .carlabel{background:#101015}
.dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.carlabel .nm{font-size:11.5px;font-weight:600;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.carlabel .pl{font-family:var(--mono);font-size:9px;color:var(--mut2)}
.track{position:relative;flex:1 1 auto}
.wecol{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.018);pointer-events:none}
.todayline{position:absolute;top:0;bottom:0;width:2px;background:linear-gradient(var(--gold),rgba(212,175,55,.2));z-index:4;pointer-events:none;box-shadow:0 0 8px rgba(212,175,55,.5)}
.bar{position:absolute;height:22px;border-radius:5px;display:flex;align-items:center;padding:0 7px;font-size:10px;font-weight:600;color:#0c0c0c;white-space:nowrap;overflow:hidden;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.5);border:1px solid rgba(0,0,0,.25);z-index:3;transition:filter .12s,transform .12s}
.bar:hover{filter:brightness(1.12);transform:translateY(-1px);z-index:8}
.bar.dim{color:#e8e8e8}
#tip{position:fixed;z-index:50;pointer-events:none;display:none;max-width:280px;background:#16161d;border:1px solid var(--gold-dp);border-radius:10px;padding:11px 13px;box-shadow:0 14px 40px rgba(0,0,0,.6)}
#tip .t1{font-family:var(--serif);font-size:16px;color:var(--gold-br);margin-bottom:2px}
#tip .t2{font-size:11px;color:var(--mut);margin-bottom:7px}
#tip .row{display:flex;justify-content:space-between;gap:18px;font-size:11.5px;margin:2px 0}
#tip .row b{font-family:var(--mono);color:var(--txt)}
#tip .cta{font-size:10px;color:var(--gold-br);margin-top:8px;text-align:center;border-top:1px solid var(--line);padding-top:6px}
#ov{position:fixed;inset:0;background:rgba(4,4,6,.74);backdrop-filter:blur(3px);z-index:70;display:none;align-items:center;justify-content:center;padding:20px}
#ov.show{display:flex}
.modal{width:480px;max-width:100%;max-height:92vh;overflow-y:auto;background:linear-gradient(180deg,#1a1a22,var(--bg2));border:1px solid var(--gold-dp);border-radius:18px;padding:0;box-shadow:0 30px 90px rgba(0,0,0,.7)}
.modal .mh{padding:20px 24px 16px;border-bottom:1px solid var(--line);position:relative}
.modal .mh .stripe{position:absolute;left:0;top:0;bottom:0;width:4px}
.modal .mh .c1{font-family:var(--serif);font-size:25px;color:var(--gold-br);line-height:1.05}
.modal .mh .c2{font-size:12px;color:var(--mut);margin-top:4px;font-family:var(--mono)}
.mb{padding:16px 24px 6px}
.mrow{display:flex;justify-content:space-between;gap:20px;padding:9px 0;border-bottom:1px solid #18181f;font-size:13px}
.mrow .k{color:var(--mut)}
.mrow .v{font-family:var(--mono);color:var(--txt);text-align:right}
.loc{padding:12px 24px 18px}
.loc .lh{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold-br);margin:6px 0 10px}
.loc .lp{display:flex;gap:11px;align-items:flex-start;margin-bottom:11px}
.loc .lp .pin{color:var(--gold);font-size:15px;flex:0 0 auto}
.loc .lp .lk{font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--mut2)}
.loc .lp .lv{font-size:13.5px;color:var(--txt);margin-top:1px;word-break:break-word}
.loc .lp .lv.empty{color:var(--mut2);font-style:italic}
.mf{padding:14px 24px 20px;display:flex;justify-content:flex-end;border-top:1px solid var(--line)}
.foot{margin-top:24px;text-align:center;color:var(--mut2);font-size:11px;letter-spacing:.5px}
@media(max-width:700px){
  html,body{overflow-x:hidden}
  .wrap{padding:10px 10px 60px}
  .panel{padding:12px}
  .panel h2{font-size:19px}
  .ph .muted{display:none}
  .calbar{gap:8px}
  .calbar input[type=date]{font-size:13px}
  .LBLW{width:116px!important}
  .carlabel{padding:0 8px!important}
  .carlabel .nm{font-size:10.5px}
  .carlabel .pl{font-size:8px}
  .bar{height:24px}
  #tip{display:none!important}
  #ov{padding:10px}
  .modal{width:100%}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <div class="ph"><div><h2>Fleet Timeline</h2><div class="muted">Each row is a vehicle &middot; each bar is a rental &middot; tap a bar for details</div></div></div>
    <div class="calbar">
      <div class="seg" id="rangeSeg">
        <button data-r="15" class="active">15 days</button><button data-r="30">30 days</button>
        <button data-r="90">90 days</button><button data-r="all">All</button></div>
      <span style="color:var(--mut);font-size:12px">From</span>
      <input type="date" id="dFrom"><span style="color:var(--mut);font-size:12px">to</span><input type="date" id="dTo">
      <button class="btn" onclick="centerToday()">Today</button>
    </div>
    <div class="calscroll" id="calscroll"><div class="calgrid" id="calgrid"></div></div>
  </div>
  <div class="foot">IMPERIUM LUXURY MIAMI &middot; operations calendar</div>
</div>

<div id="tip"></div>
<div id="ov" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>

  while(i<nDays){let d=new Date(+from+i*DAYMS),m=d.getMonth(),y=d.getFullYear(),cnt=0;
    while(i+cnt<nDays){let dd=new Date(+from+(i+cnt)*DAYMS);if(dd.getMonth()!==m||dd.getFullYear()!==y)break;cnt++;}
    html+='<div class="monthcell" style="width:'+(cnt*DAYW)+'px">'+MONF[m]+' '+y+'</div>';i+=cnt;}
  html+='</div></div><div class="dayrow"><div class="cornercell LBLW" style="font-size:9px">'+nDays+' days</div><div style="display:flex">';
  for(let j=0;j<nDays;j++){let d=new Date(+from+j*DAYMS),we=(d.getDay()===0||d.getDay()===6),isT=+dkey(d)===+dkey(TODAY);
    html+='<div class="daycell '+(we?'we':'')+' '+(isT?'today':'')+'" style="width:'+DAYW+'px"><span class="dow">'+DOW[d.getDay()].slice(0,1)+'</span>'+d.getDate()+'</div>';}
  html+='</div></div>';
  const cars=[...DATA.fleet];const cnt={};DATA.rentals.forEach(r=>cnt[r.plate]=(cnt[r.plate]||0)+1);
  cars.sort((a,b)=>(cnt[b.plate]||0)-(cnt[a.plate]||0));
  for(const c of cars){
    html+='<div class="carrow" style="height:'+ROWH+'px"><div class="carlabel LBLW"><span class="dot" style="background:'+c.hex+'"></span><div style="min-width:0"><div class="nm">'+(c.model.length>26?c.model.slice(0,25)+'…':c.model)+'</div><div class="pl">'+c.plate+'</div></div></div><div class="track" style="width:'+(nDays*DAYW)+'px">';
    for(let j=0;j<nDays;j++){let d=new Date(+from+j*DAYMS);if(d.getDay()===0||d.getDay()===6)html+='<div class="wecol" style="left:'+(j*DAYW)+'px;width:'+DAYW+'px"></div>';}
    if(TODAY>=from&&TODAY<=to){let off=Math.round((dkey(TODAY)-from)/DAYMS)*DAYW+DAYW/2;html+='<div class="todayline" style="left:'+off+'px"></div>';}
    DATA.rentals.filter(r=>r.plate===c.plate&&r.e>=from&&r.s<=new Date(+to+DAYMS)).forEach(r=>{
      let s=dkey(r.s)<from?from:dkey(r.s),eC=dkey(r.e)>to?to:dkey(r.e);
      let left=Math.round((s-from)/DAYMS)*DAYW+3,w=Math.max((Math.round((eC-s)/DAYMS)+1)*DAYW-6,DAYW-6);
      let dim=['#26272d','#33343a','#2a52be','#1c1d22'].includes(c.hex),last=r.cust.split(' ').slice(-1)[0];
      html+='<div class="bar '+(dim?'dim':'')+'" style="left:'+left+'px;width:'+w+'px;top:6px;background:'+c.hex+'" data-ri="'+r._ri+'">'+(w>46?last:'')+'</div>';});
    html+='</div></div>';}
  grid.style.width=(LBLW+nDays*DAYW)+'px';grid.innerHTML=html;
  grid.querySelectorAll('.bar').forEach(b=>{const ri=+b.dataset.ri;
    b.addEventListener('mousemove',e=>showTip(e,ri));b.addEventListener('mouseleave',hideTip);
    b.addEventListener('click',e=>{e.stopPropagation();hideTip();openModal(ri);});});
}
function showTip(e,ri){const r=DATA.rentals[ri];if(!r)return;const t=document.getElementById('tip'),c=r.car;
  t.innerHTML='<div class="t1">'+r.cust+'</div><div class="t2">'+(c?c.make+' '+c.model:'')+' &middot; <span style="font-family:var(--mono)">'+r.plate+'</span>'+(r.ag!=null?' &middot; #'+r.ag:'')+'</div>'+
    '<div class="row"><span>Period</span><b>'+fmtDate(r.s)+' &rarr; '+fmtDate(r.e)+'</b></div>'+
    '<div class="row"><span>Days</span><b>'+r.days+'</b></div>'+
    '<div class="cta">Tap for delivery &amp; pick-up</div>';
  t.style.display='block';let x=e.clientX+14,y=e.clientY+14;
  if(x+290>innerWidth)x=e.clientX-290;if(y+150>innerHeight)y=e.clientY-150;t.style.left=x+'px';t.style.top=y+'px';}
function hideTip(){document.getElementById('tip').style.display='none';}

function openModal(ri){
  const r=DATA.rentals[ri];if(!r)return;const c=r.car;
  const del=r.delivery?'<div class="lv">'+r.delivery+'</div>':'<div class="lv empty">Not specified yet</div>';
  const pick=r.pickup?'<div class="lv">'+r.pickup+'</div>':'<div class="lv empty">Not specified yet</div>';
  document.getElementById('modal').innerHTML=
    '<div class="mh"><div class="stripe" style="background:'+(c?c.hex:'#777')+'"></div>'+
      '<div class="c1">'+r.cust+'</div>'+
      '<div class="c2">'+(c?c.make+' '+c.model:'—')+' &middot; '+r.plate+(r.ag!=null?' &middot; #'+r.ag:'')+'</div></div>'+
    '<div class="mb">'+
      '<div class="mrow"><span class="k">Period</span><span class="v">'+fmtDate(r.s)+' &rarr; '+fmtDate(r.e)+'</span></div>'+
      '<div class="mrow"><span class="k">Duration</span><span class="v">'+r.days+' day'+(r.days>1?'s':'')+'</span></div>'+
    '</div>'+
    '<div class="loc"><div class="lh">Delivery &amp; Pick-up</div>'+
      '<div class="lp"><div class="pin">&#9656;</div><div><div class="lk">Delivery</div>'+del+'</div></div>'+
      '<div class="lp"><div class="pin">&#9666;</div><div><div class="lk">Pick-up</div>'+pick+'</div></div>'+
    '</div>'+
    ((r.phone||r.email)?('<div class="loc" style="padding-top:0"><div class="lh">Contact</div>'+
      (r.phone?'<div class="lp"><div class="pin">&#9742;</div><div><div class="lk">Phone</div><div class="lv"><a href="tel:'+r.phone+'" style="color:var(--gold-br)">'+r.phone+'</a></div></div></div>':'')+
      (r.email?'<div class="lp"><div class="pin">&#9993;</div><div><div class="lk">Email</div><div class="lv"><a href="mailto:'+r.email+'" style="color:var(--gold-br)">'+r.email+'</a></div></div></div>':'')+
    '</div>'):'')+
    (r.notes?('<div class="loc" style="padding-top:0"><div class="lh">Notes</div><div class="lp"><div class="pin">&#10033;</div><div class="lv">'+r.notes+'</div></div></div>'):'')+
    '<div class="mf"><button class="btn" onclick="closeModal()">Close</button></div>';
  document.getElementById('ov').classList.add('show');
}
function closeModal(){document.getElementById('ov').classList.remove('show');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

function jumpToday(){const sc=document.getElementById('calscroll');sc.scrollLeft=Math.max(0,Math.round((dkey(TODAY)-calFrom)/DAYMS)*DAYW-sc.clientWidth/2);}
function fitDays(n){n=n||15;fitMode=true;
  const sc=document.getElementById('calscroll');
  const avail=(sc.clientWidth||1000)-LBLW-6;
  DAYW=Math.max(28,Math.floor(avail/n));
  const half=Math.floor(n/2);
  setRange(new Date(+TODAY-half*DAYMS),new Date(+TODAY+(n-1-half)*DAYMS));
  sc.scrollLeft=0;}
function centerToday(){if(fitMode)fitDays(15);else jumpToday();}
var _rz;addEventListener('resize',function(){clearTimeout(_rz);_rz=setTimeout(function(){if(fitMode)fitDays(15);},200);});
document.getElementById('calscroll').addEventListener('wheel',function(e){if(e.shiftKey){this.scrollLeft+=e.deltaY;e.preventDefault();}},{passive:false});
document.getElementById('rangeSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  [...e.currentTarget.children].forEach(x=>x.classList.remove('active'));b.classList.add('active');
  const r=b.dataset.r,[mn,mx]=dataExtent();
  if(r==='15'){fitDays(15);return;}
  fitMode=false;DAYW=30;
  if(r==='all')setRange(mn,mx);else if(r==='90')setRange(new Date(+TODAY-60*DAYMS),new Date(+TODAY+30*DAYMS));
  else if(r==='30')setRange(new Date(+TODAY-15*DAYMS),new Date(+TODAY+15*DAYMS));
  setTimeout(jumpToday,30);});
document.getElementById('dFrom').addEventListener('change',e=>{fitMode=false;calFrom=dkey(new Date(e.target.value+'T12:00'));renderCal();});
document.getElementById('dTo').addEventListener('change',e=>{fitMode=false;calTo=dkey(new Date(e.target.value+'T12:00'));renderCal();});

fitDays(15);
if(AUTO_REFRESH_MINUTES>0){setTimeout(function(){
  var u=location.href.split('#')[0].replace(/([?&])_r=\d+/,'$1').replace(/[?&]$/,'');
  u+=(u.indexOf('?')>=0?'&':'?')+'_r='+Date.now();
  location.replace(u);
},AUTO_REFRESH_MINUTES*60000);}
</script>
</body>
</html>
